<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaChamps — Mind Vault: Term Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #0d0e1c;
    --panel: #16213e;
    --panel-edge: #0a0f24;
    --mint: #06d6a0;
    --mint-dim: #04a37a;
    --amber: #ffd166;
    --alert: #ef476f;
    --sky: #4cc9f0;
    --text: #eef2f7;
    --text-dim: #8b93b5;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-void);
    font-family:'Space Mono', monospace;
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .console{
    position:relative; width:100%; max-width:560px; margin:24px;
    background: var(--panel);
    border:4px solid var(--panel-edge);
    box-shadow: 0 0 0 4px #2a3357, 0 20px 60px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  .console::after{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px);
    pointer-events:none; z-index:5;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--panel-edge); border-bottom:3px solid #2a3357; }
  .brand{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--mint); letter-spacing:1px; }
  .semester-tag{ font-family:'Press Start 2P', monospace; font-size:8px; color:var(--amber); background:rgba(255,209,102,0.08); border:1px solid var(--amber); padding:4px 6px; }

  .meter-wrap{ padding:12px 14px 6px; border-bottom:3px solid #2a3357; }
  .meter-label{ font-size:10px; color:var(--text-dim); display:flex; justify-content:space-between; margin-bottom:6px; }
  .meter-label b{ color:var(--mint); }
  .meter{ display:flex; gap:3px; height:14px; }
  .meter-seg{ flex:1; background:#1f2745; border:2px solid var(--panel-edge); transition: background .25s ease; }
  .meter-seg.filled{ background: var(--mint); }

  .stage{ padding:18px 16px 20px; min-height:440px; display:flex; flex-direction:column; }

  .screen-title{ font-family:'Press Start 2P', monospace; font-size:13px; margin:0 0 4px; line-height:1.6; }
  .screen-sub{ font-size:11px; color:var(--text-dim); margin:0 0 14px; line-height:1.6; }

  .stat-row{ display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim); margin-bottom:12px; }
  .stat-row b{ color:var(--amber); }

  .card-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:14px; }
  .card{
    aspect-ratio:1/0.85;
    background:#1f2745; border:2px solid #34406e; color:var(--text);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:10.5px; line-height:1.35; padding:6px; cursor:pointer;
    font-family:'Space Mono', monospace;
  }
  .card .back-icon{ font-family:'Press Start 2P', monospace; font-size:16px; color:var(--mint-dim); }
  .card.flipped{ background:#26305a; border-color:var(--sky); cursor:default; }
  .card.matched{ background:rgba(6,214,160,0.16); border-color:var(--mint); cursor:default; opacity:0.9; }
  .card.wrong-flash{ background:rgba(239,71,111,0.2); border-color:var(--alert); }
  .card.term{ font-weight:700; color:var(--amber); }

  .streak{ font-size:10px; color:var(--amber); margin-bottom:8px; min-height:14px; }

  .end-screen{ display:none; text-align:center; padding:20px 6px; margin-top:auto; }
  .end-screen.show{ display:block; }
  .end-title{ font-family:'Press Start 2P', monospace; font-size:14px; color:var(--mint); margin-bottom:14px; line-height:1.6; }
  .end-score{ font-size:34px; color:var(--amber); font-weight:700; margin:10px 0; }
  .end-desc{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-bottom:20px; }
  .restart-btn{ font-family:'Press Start 2P', monospace; font-size:10px; background:var(--mint); color:#06251c; border:none; padding:12px 18px; cursor:pointer; }

  .play-wrap.hidden, .end-holder.hidden{ display:none; }

  footer.note{ font-size:10px; color:var(--text-dim); text-align:center; padding:10px; border-top:3px solid #2a3357; background:var(--panel-edge); }
</style>
</head>
<body>

<div class="console">
  <div class="topbar">
    <div class="brand">PHARMACHAMPS</div>
    <div class="semester-tag">MIND VAULT: TERM MATCH</div>
  </div>

  <div class="meter-wrap">
    <div class="meter-label"><span>POIN COCOK</span><span><b id="pointNow">0</b> / <span id="pointTarget">280</span></span></div>
    <div class="meter" id="meter"></div>
  </div>

  <div class="stage">
    <div class="play-wrap" id="playWrap">
      <h2 class="screen-title">COCOKKAN ISTILAH &amp; ARTINYA</h2>
      <p class="screen-sub">Buka 2 kartu tiap giliran — cocokkan istilah farmasi dengan artinya</p>

      <div class="stat-row">
        <span>PASANGAN: <b id="pairsFound">0</b>/6</span>
        <span>PERCOBAAN: <b id="attemptsCount">0</b></span>
      </div>

      <div class="streak" id="streakLine"></div>

      <div class="card-grid" id="cardGrid"></div>
    </div>

    <div class="end-holder hidden" id="endHolder">
      <div class="end-screen show">
        <div class="end-title">SESI COCOKKAN ISTILAH<br>SELESAI</div>
        <div class="end-score" id="finalScore">0</div>
        <div class="end-desc" id="finalDesc"></div>
        <button class="restart-btn" id="restartBtn">ULANGI PROTOTYPE</button>
      </div>
    </div>
  </div>

  <footer class="note">prototype mini-game · v0.1 · kartu akan diganti ikon obat/organ sprite asli di Unity</footer>
</div>

<script>
const TARGET_POINTS = 280;

const pairsData = [
  { term:'ANALGESIK', def:'Pereda nyeri' },
  { term:'ANTIPIRETIK', def:'Penurun demam' },
  { term:'ANTASIDA', def:'Penetral asam lambung' },
  { term:'ANTIEMETIK', def:'Pereda mual & muntah' },
  { term:'ANTIHISTAMIN', def:'Pereda reaksi alergi' },
  { term:'DIURETIK', def:'Peluruh kemih (urine)' },
];

let cards = [];
let flipped = [];
let lock = false;
let pairsFound = 0;
let attempts = 0;
let score = 0;
let streak = 0;

const meterEl = document.getElementById('meter');
const SEGMENTS = 20;
for(let i=0;i<SEGMENTS;i++){
  const seg = document.createElement('div'); seg.className='meter-seg'; meterEl.appendChild(seg);
}
function updateMeter(){
  document.getElementById('pointNow').textContent = score;
  const filled = Math.min(SEGMENTS, Math.round((score/TARGET_POINTS)*SEGMENTS));
  [...meterEl.children].forEach((seg,i)=> seg.classList.toggle('filled', i<filled));
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildCards(){
  const raw = [];
  pairsData.forEach((p, i)=>{
    raw.push({ pairId:i, type:'term', text:p.term });
    raw.push({ pairId:i, type:'def', text:p.def });
  });
  cards = shuffle(raw).map((c,idx)=> ({...c, cardId:idx, matched:false}));
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML='';
  cards.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'card' + (c.matched ? ' matched' : '');
    el.dataset.cardId = c.cardId;
    if(c.matched || flipped.find(f=>f.cardId===c.cardId)){
      el.innerHTML = c.type==='term' ? `<span class="term">${c.text}</span>` : `<span>${c.text}</span>`;
      if(!c.matched) el.classList.add('flipped');
    } else {
      el.innerHTML = `<span class="back-icon">℞</span>`;
    }
    el.addEventListener('click', ()=> handleFlip(c));
    grid.appendChild(el);
  });
  document.getElementById('pairsFound').textContent = pairsFound;
  document.getElementById('attemptsCount').textContent = attempts;
  document.getElementById('streakLine').textContent = streak>=2 ? `🔥 STREAK x${streak}` : '';
}

function handleFlip(c){
  if(lock || c.matched || flipped.find(f=>f.cardId===c.cardId)) return;
  flipped.push(c);
  renderCards();

  if(flipped.length===2){
    attempts++;
    lock = true;
    const [a,b] = flipped;
    const isMatch = a.pairId===b.pairId && a.type!==b.type;
    if(isMatch){
      setTimeout(()=>{
        cards.find(x=>x.cardId===a.cardId).matched = true;
        cards.find(x=>x.cardId===b.cardId).matched = true;
        pairsFound++;
        const bonus = streak>=2 ? 10 : 0;
        score += 30 + bonus;
        streak++;
        flipped = [];
        lock = false;
        updateMeter();
        renderCards();
        if(pairsFound >= pairsData.length){
          setTimeout(showEnd, 500);
        }
      }, 500);
    } else {
      streak = 0;
      document.querySelectorAll('.card.flipped').forEach(el=> el.classList.add('wrong-flash'));
      setTimeout(()=>{
        flipped = [];
        lock = false;
        renderCards();
      }, 800);
    }
  }
}

function showEnd(){
  document.getElementById('playWrap').classList.add('hidden');
  document.getElementById('endHolder').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;
  const efficient = attempts <= pairsData.length + 2;
  document.getElementById('finalDesc').textContent = efficient
    ? `Selesai dalam ${attempts} percobaan — ingatanmu soal istilah farmasi cukup kuat!`
    : `Selesai dalam ${attempts} percobaan. Ulangi lagi untuk memperkuat hafalan istilahnya.`;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  pairsFound=0; attempts=0; score=0; streak=0; flipped=[]; lock=false;
  buildCards();
  document.getElementById('playWrap').classList.remove('hidden');
  document.getElementById('endHolder').classList.add('hidden');
  updateMeter();
  renderCards();
});

buildCards();
updateMeter();
renderCards();
</script>

</body>
</html>
